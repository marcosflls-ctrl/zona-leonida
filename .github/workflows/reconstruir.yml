name: Reconstruir web a diario

# Vuelve a generar la web cada mañana para que aparezcan los artículos programados
# con fecha futura. Necesita el secreto CF_DEPLOY_HOOK (Cloudflare Pages > Settings > Builds > Deploy hooks).
on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Cloudflare Pages
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "CF_DEPLOY_HOOK no configurado"; fi
