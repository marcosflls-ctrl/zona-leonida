name: Galería oficial de Rockstar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/galeria.json]

permissions:
  contents: write

concurrency:
  group: galeria
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/galeria.py
      - name: Guardar imágenes
        run: |
          git config user.name "zona-leonida-bot"
          git config user.email "bot@zonaleonida.com"
          git add public/img/oficial
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Galería oficial: imágenes de Rockstar Games"
          git pull --rebase origin main
          git push
