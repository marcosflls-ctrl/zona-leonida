name: Publicar en Telegram

# Cuando entra en la web un artículo NUEVO (por ejemplo, al aprobar los borradores del robot),
# espera a que esté publicado y lo envía al canal t.me/zonaleonida.
on:
  push:
    branches: [main]
    paths: ["src/content/posts/**.md"]
  workflow_dispatch:          # para enviar a mano artículos ya publicados
    inputs:
      archivos:
        description: "Nombres de archivo separados por espacios (ej. gta-6-pc.md)"
        required: true

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Artículos nuevos de este cambio
        id: nuevos
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=""; for f in ${{ github.event.inputs.archivos }}; do FILES="$FILES src/content/posts/$f"; done
            echo "files=$FILES" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'src/content/posts/*.md' | tr '\n' ' ')
          # también las guías que estaban en borrador y se acaban de publicar (draft: true → draft: false)
          for f in $(git diff --name-only --diff-filter=M "$BEFORE" "${{ github.sha }}" -- 'src/content/posts/*.md'); do
            if git diff "$BEFORE" "${{ github.sha }}" -- "$f" | grep -q '^-draft: true' && grep -q '^draft: false' "$f"; then
              FILES="$FILES $f"
            fi
          done
          echo "Nuevos: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Enviar al canal
        if: steps.nuevos.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          pip install -q requests
          [ "${{ github.event_name }}" = "push" ] && sleep 60   # margen para que Cloudflare empiece a publicar
          python scripts/telegram.py ${{ steps.nuevos.outputs.files }}

      # Si algo de lo anterior falla, te avisa en privado por Telegram (necesita el secreto TELEGRAM_AVISOS_CHAT_ID)
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "Sin chat de avisos configurado"; exit 0; }
          curl -s -o /dev/null -w "Telegram: %{http_code}\n" -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Ha fallado «${{ github.workflow }}» de Zona Leonida. Mira qué ha pasado: ${URL_EJECUCION}"
